name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cross-repo dependencies (@iris/context, @iris/pi-*) are consumed through
      # EXACT commit/tree pins from src/contracts/pins/production-lock.json
      # (iris_agent#131). The `npm ci` preinstall hook runs
      # scripts/bootstrap-vendor-deps.mjs, which materializes the pinned
      # checkouts into <repo>/../.iris-vendor and builds them — no manual
      # sibling checkout, no nonexistent blueforst/pi checkout, no hardcoded
      # SHA. test/production-lock.test.ts then verifies the materialized
      # vendor dirs against the same pin (fail closed on drift/tamper).
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      # npm ci runs the preinstall bootstrap (fetch+build vendored deps at
      # exact pins), then installs iris_agent's own dependencies.
      - run: npm ci
      # Repository hygiene guard (iris_agent#86): reject tracked node_modules
      # and absolute /tmp-style symlinks before running any build.
      - run: node scripts/check-repo-hygiene.mjs
      # Single aggregate check (format/lint/typecheck/unit + clean-layout +
      # production-lock + subprocess + migration/crash/build/CLI/dist smoke) so
      # CI never drifts from the repository's own check contract — including
      # the subprocess suite that exercises the real long-lived Host.
      - run: npm run check
